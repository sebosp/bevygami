<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bevygami</title>
  <link data-trunk rel="rust" data-bin="bevygami" data-cargo-profile-release="wasm-release" data-wasm-opt="s" />
  <link data-trunk rel="icon" href="assets/web/favicon.svg" />
  <meta name="theme-color" content="#1b1c22" />
  <style>
    html, body { margin: 0; height: 100%; background: #1b1c22; overflow: hidden; }
    #bevygami { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="bevygami" tabindex="0"></canvas>
  <script>
    // The keys go to the canvas, focus it on load and on click.
    const canvas = document.getElementById('bevygami');
    window.addEventListener('load', () => canvas.focus());
    canvas.addEventListener('pointerdown', () => canvas.focus());
  </script>
</body>
</html>
